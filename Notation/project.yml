# XcodeGen spec. `xcodegen generate` regenerates Notation.xcodeproj from this file.
# The committed .xcodeproj is equivalent (Xcode 16+ folder-synced groups); use this if it ever misbehaves.
name: Notation
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftyDropbox:
    url: https://github.com/dropbox/SwiftyDropbox.git
    from: 10.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Notation:
    type: application
    platform: iOS
    sources: [Notation]
    dependencies:
      - package: SwiftyDropbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Notation
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Notation
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    postCompileScripts:
      - name: Copy Dropbox Config
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/Config.plist"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Config.plist"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST"
          else
            rm -f "$DEST"
            echo "warning: Config.plist not found. Dropbox sync is disabled; see Notation/README.md."
          fi
  NotationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NotationTests]
    dependencies:
      - target: Notation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NotationTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Notation.app/Notation"
        BUNDLE_LOADER: "$(TEST_HOST)"
